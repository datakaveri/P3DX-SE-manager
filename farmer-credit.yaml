apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmer-credit-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farmer-credit-app
  template:
    metadata:
      labels:
        app: farmer-credit-app
      annotations:
          io.katacontainers.config.runtime.cc_init_data: ""
          io.containerd.cri.runtime-handler: kata-remote
    spec:
      runtimeClassName: kata-remote
      containers:
      - name: farmer-credit-app
        image: ghcr.io/datakaveri/farmer-credit-app:p3dx-v1.1-encrypted
        imagePullPolicy: Always
        volumeMounts:
        - name: context
          mountPath: /app/context
          readOnly: false
      volumes:
      - name: context
        configMap:
          name: farmer-credit-app-context

# Paths and directories
paths:
  # Base directory
  base_dir: ${BASE_DIR}
  
  # Key management
  keys_dir: ${BASE_DIR}/keys
  
  # Bundle directory
  bundle_dir: ${BASE_DIR}/Bundle
  
  # TEE (Trusted Execution Environment) directories
  tee_input_data: /tmp/tee_input/data
  tee_input_config: /tmp/tee_input/config
  tee_output: /tmp/tee_output
  tee_urls: /tmp/urls
  # skald-fta opens /app/config/config.json by exact name, while the bundle
  # lands the config under whatever metadata.fileNames.config said (default
  # generated-config.json). This staging dir holds a byte-identical copy under
  # the name skald-fta needs, so the config mount SKALD sees stays untouched.
  tee_fta_config: /tmp/tee_input/fta_config
  
  # Guest attestation directory
  guest_attestation: ${BASE_DIR}/guest_attestation/cvm-attestation-sample-app

# File names
files:
  # Docker and configuration
  docker_compose: docker-compose.yml
  config_file: DPconfig.json
  
  # Cryptographic materials
  public_key: public_key.pem
  # Written only when KEY_SEALING=off (development). In normal operation the
  # private key exists on disk solely as private_key_enc, encrypted under a
  # vTPM-sealed KEK. See lib/sealed_key.py.
  private_key: private_key.pem
  private_key_enc: private_key.enc
  kek_pub: kek.pub
  kek_priv: kek.priv
  key_generation: key_generation.json
  
  # Attestation and measurement
  jwt_response: jwt-response.txt
  deployment_nonce: deployment_nonce.txt
  pcr_values: pcr_values.json
  code_hash: code_hash.txt
  image_hash: image_hash.txt
  fta_image_hash: fta_image_hash.txt
  fta_artifacts: fta_artifacts.json
  
  # Bundle and URLs
  encrypted_bundle: encrypted.json
  decrypted_urls: decrypted_urls.json
  
  # Application output
  status: status.json

# Commands and executables
commands:
  python: python3
  docker_compose: docker-compose
  use_sudo: true  # Whether to prefix commands with sudo

# Service configuration
service:
  name: enclavemanager.service
  port: 4000
  host: 0.0.0.0

# Azure endpoints (standard Azure URLs)
azure:
  # Azure Instance Metadata Service
  imds_url: http://169.254.169.254/metadata/identity/oauth2/token
  
  # Azure resource endpoints for Managed Identity
  storage_resource: https://storage.azure.com/
  vault_resource: https://vault.azure.net

# DICOM de-identification (SKALD-DICOM application)
dicom:
  # The de-identified .dcm output is Fernet-encrypted (same shared Key Vault
  # key as the input) before it is stored back to the output container. Set to
  # false only if the policy allows plaintext output.
  encrypt_output: true

# Free-text anonymisation (skald-fta) — the pipeline stage that runs BEFORE
# SKALD when the client's app config sets
# <data_type>.free_text_anonymization.enabled = true. It masks PII/NER hits
# inside the configured free-text columns and writes a sanitised CSV that SKALD
# then consumes instead of the raw file in data/ (SKALD's own config parser
# picks up staged_input_path from that same block — the enclave never rewrites
# the config to arrange this, it only shares the output/ mount).
free_text_anonymization:
  # Pinned image ref. Prefer an immutable digest for TEE reproducibility, e.g.
  #   image: ghcr.io/datakaveri/skald-fta@sha256:<digest>
  # A mutable tag can be repushed and breaks the trust model, exactly as noted
  # for the SKALD image in docker-compose.yml.
  image: ghcr.io/datakaveri/skald-fta:latest
  # If the client-supplied docker-compose.yml declares a service with this
  # name, its `image:` wins over the pin above — that is how the forthcoming
  # skald-fta compose entry gets honoured without a code change.
  compose_service: skald-fta
  # Hard wall-clock cap on the container. A hung NER model would otherwise
  # block the run forever, since the enclave waits on this stage.
  timeout_seconds: 3600
  # Default staged/audit filenames, used only to seed the upload exclusion set
  # when the config omits the corresponding field. The authoritative exclusion
  # list is the set of files skald-fta actually created (see
  # P3DX_SDK._record_free_text_artifacts).
  default_staged_name: sanitized_input.csv
  default_audit_name: free_text_audit.json

# Direct dataset upload (chunked, browser-encrypted, no Azure Blob for input).
# Limits are pinned to backend-changes-direct-upload.md §2.7 and MUST stay in
# lockstep with the frontend's `direct_upload` block in
# src/environments/environments.ts — a mismatch surfaces as a confusing 413
# after the user has already picked a file, so flag any change on both sides.
direct_upload:
  chunk_size: 67108864                # 64 MiB
  max_chunks: 16
  max_chunk_bytes: 67108928           # chunk_size + 64
  max_concurrent_sessions_per_user: 1
  max_total_bytes:
    csv: 104857600                    # 100 MB
    json: 104857600
    excel: 26214400                   #  25 MB
    dicom: 104857600
  session_ttl_seconds: 1800           # 30 min idle
  output_ttl_seconds: 7200            #  2 hours
  # Reuses the same account/container + Managed Identity as the DICOM/tabular
  # output path (access already proven there).
  output_container: anondata2/output-data
  # Must be a tmpfs mount, NOT host disk. This process is host gunicorn (not
  # containerized) on this CVM — see the note where this key is consumed.
  scratch_dir: /enclave/scratch

# ImmuDB (run_history audit log)
immudb:
  host: ${IMMUDB_HOST}
  port: ${IMMUDB_PORT}
  user: ${IMMUDB_USER}
  database: ${IMMUDB_DATABASE}
  # IMMUDB_PASSWORD is read from env only — not stored here

# CORS (Cross-Origin Resource Sharing) configuration
cors:
  origins:
    - http://localhost:5173
    - http://localhost:3000
    - https://spider.p3dx.iudx.org.in
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allow_headers:
    - Content-Type
    - Authorization
    - X-Requested-With
  expose_headers:
    - Content-Type
    - Authorization
  supports_credentials: true
  max_age: 3600
